<!DOCTYPE html>
<html lang="pt-br">
<head> 
    <meta charset="UTF-8">
    <title>meus estudos legais</title>
</head>
<body>
    <h1>meus estudos legais</h1>
    <input type="text" id="resposta" placeholder="Digite aqui...">
    <button onclick="enviar()">Enviar</button>
    <div id="saida"></div>

<script>
// No JavaScript, nomes de objetos não podem ter espaços!
const DATABASE = {
    "treino_dos_meus_estudos": {
        "oi": "tomara q isso der certo kakakkka",
        "Roberto": "oi estou aq treino de sites kkkk"
    }
}

function enviar() {
    const input = document.getElementById("resposta").value;
    const saida = document.getElementById("saida");
    
    // Pega a resposta de dentro do DATABASE
    const respostaBot = DATABASE["treino_dos_meus_estudos"][input];

    if (respostaBot) {
        saida.innerHTML = "<p><strong>Inforbot:</strong> " + respostaBot + "</p>";
    } else {
        saida.innerHTML = "<p><strong>Inforbot:</strong> Não entendi, Roberto!</p>";
    }
}
</script>
</body>
</html>
