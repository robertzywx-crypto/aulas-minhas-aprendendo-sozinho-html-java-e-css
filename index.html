<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>molde</title>
    <style>
        /* RESET BÁSICO - Para o site não ter espaços sobrando */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Faz o site ocupar a tela toda */
            background-color: #f4f4f4;
        }

        /* TOPO DO SITE */
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* BARRA DE NAVEGAÇÃO */
        nav {
            background-color: #444;
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover { color: #2ecc71; }

        /* CORPO DO SITE (CONTEÚDO + BARRA LATERAL) */
        .container {
            display: flex;
            flex: 1; /* Faz essa parte crescer para empurrar o rodapé */
            padding: 20px;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* CONTEÚDO PRINCIPAL */
        article {
            flex: 3;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* BARRA LATERAL (SIDEBAR) */
        aside {
            flex: 1;
            background: #ddd;
            padding: 20px;
            border-radius: 8px;
        }

        /* RODAPÉ */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        /* BOTÃO DE TESTE */
        .btn-enviar {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>molde</h1>
    </header>

    <nav>
        <a href="#">molde de palavras de pesquisa</a>
        <a href="#">molde de palavras de pesquisa</a>
        <a href="#">molde de palavras de pesquisa</a>
        <a href="#">molde de palavras de pesquisa</a>
    </nav>

    <div class="container">
        <article>
            <h2>molde segundo titulo</h2>
            <p>molde</p>
            <br>
            <input type="text" id="campo" placeholder="Digite algo...">
            <button class="btn-enviar" onclick="disparar()">Enviar</button>
            <p id="resultado"></p>
        </article>

    <footer>
        <p>&copy; 2026 - Desenvolvido por ...</p>
    </footer>

    <script>
        function disparar() {
            let texto = document.getElementById('campo').value;
            document.getElementById('resultado').innerText = "Você enviou: " + texto;
        }
    </script>

</body>
</html>
